environment:
  game_mode: 1v1
  max_episode_steps: 3000
  num_envs: 64
  tick_skip: 8
hyperparameters:
  batch_size: 8192
  clip_range: 0.2
  ent_coef: 0.015
  gae_lambda: 0.95
  gamma: 0.995
  learning_rate: 0.0003
  mini_batch_size: 1024
  n_epochs: 4
logging:
  checkpoint_interval: 20
  log_dir: logs
  max_checkpoints_to_keep: 5
  save_dir: checkpoints
  tensorboard: true
model:
  activation: leaky_relu
  continuous_actions: true
  use_layer_norm: true
rewards:
  ball_to_goal_weight: 2.0
  boost_gain_weight: 0.5
  boost_lose_weight: 0.1
  concede_weight: -30.0
  goal_weight: 30.0
  player_to_ball_weight: 0.15
  save_weight: 5.0
  touch_weight: 1.5
scenarios:
  aerial_prob: 0.15
  kickoff_prob: 0.5
  max_replays_to_ingest: 50
  replay_prob: 0.15
  replay_sort_mode: newest
  replays_pool_path: data/replays/replays_pool.npz
  save_prob: 0.1
  wall_prob: 0.1
