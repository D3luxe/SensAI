environment:
  game_mode: 1v1
  max_episode_steps: 600
  num_env_workers: 16
  num_envs: 128
  tick_skip: 8
hyperparameters:
  batch_size: 16384
  bc_decay_steps: 500000000
  bc_regularization_weight: 0.0
  clip_range: 0.2
  critic_warmup_iterations: 50
  ent_coef: 0.008
  gae_lambda: 0.98
  gamma: 0.9977
  learning_rate: 0.00015
  log_std_floor:
  - -2.5
  - -2.0
  - -1.7
  - -2.0
  - -2.0
  mini_batch_size: 1024
  n_epochs: 4
  normalize_returns: true
  rot_log_std_anneal_iters: 4000
  rot_log_std_ceiling_final: -1.4
  vf_clip_range: null
league:
  benchmark_interval: 15
  benchmark_opponents:
  - checkpoints/necto-model.pt
  - checkpoints/nexto-model.pt
  benchmark_series: 8
  contender_mu_margin: 4.0
  contender_series_per_step: 32
  eligibility_sigma: 1.5
  enabled: true
  eval_max_steps: 3000
  eval_no_touch_steps: 500
  eval_series_per_grade: 1
  gauntlet_opponents: 3
  hall_of_fame_size: 20
  king_challenge_frequency: 3
  king_ratio: 0.25
  max_consecutive_losses: 8
  max_contender_matches: 48
  max_pool_size: 10
  max_provisional: 30
  min_contender_points_rate: 40.0
  min_matches_for_points_floor: 12
  pool_group_size: 8
  calibration_share: 0.1
  pool_ratio: 0.25
  protect_top_k: 20
  self_play_ratio: 0.5
  series_length: 9
  series_wins_needed: 5
  target_eval_matches: 30
  training_opponent_ratio: 0.1875
  training_opponents:
  - checkpoints/necto-model.pt
logging:
  archive_stride: 200
  autosave_interval: 20
  checkpoint_interval: 200
  log_dir: logs
  max_checkpoints_to_keep: 50
  save_dir: checkpoints
  tensorboard: true
model:
  activation: leaky_relu
  continuous_actions: true
  handbrake_height_buffer: 120.0
  use_action_masking: true
  use_layer_norm: true
# Reward weights, their anneal schedule and the scenario mix are frozen per reward version in
# config/reward_versions/<reward_version>.json (env/reward_registry.py); live edits to them are ignored.
reward_version: v9
