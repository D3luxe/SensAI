environment:
  game_mode: 1v1
  max_episode_steps: 3000
  num_envs: 64
  tick_skip: 8
model:
  continuous_actions: false
hyperparameters:
  batch_size: 8192
  clip_range: 0.2
  ent_coef: 0.01
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  mini_batch_size: 1024
  n_epochs: 4
logging:
  checkpoint_interval: 20
  log_dir: logs
  max_checkpoints_to_keep: 5
  save_dir: checkpoints
  tensorboard: true
rewards:
  aerial_height_weight: 0.05
  aligned_shot_weight: 25.0
  ball_vel_toward_goal_weight: 0.08
  behind_ball_weight: 0.03
  boost_management_weight: 0.08
  boost_steal_weight: 10.0
  concede_weight: -100.0
  defensive_position_weight: 0.03
  demo_bump_weight: 15.0
  dodge_rush_multi: 1.5
  face_ball_weight: 0.07
  goal_speed_multi: 1.5
  goal_weight: 100.0
  kickoff_first_touch_bonus: 35.0
  kickoff_weight: 0.05
  possession_weight: 0.1
  save_weight: 50.0
  speed_toward_ball_weight: 0.05
  touch_aerial_flip_multi: 2.5
  touch_ball_weight: 10.0
  velocity_weight: 0.045
