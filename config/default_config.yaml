environment:
  game_mode: 1v1
  max_episode_steps: 3000
  num_envs: 128
  tick_skip: 8
hyperparameters:
  batch_size: 8192
  clip_range: 0.2
  ent_coef: 0.02
  gae_lambda: 0.95
  gamma: 0.995
  learning_rate: 0.0003
  mini_batch_size: 1024
  n_epochs: 4
logging:
  checkpoint_interval: 20
  log_dir: logs
  max_checkpoints_to_keep: 5
  save_dir: checkpoints
  tensorboard: true
model:
  continuous_actions: false
rewards:
  # Module 1: Match Macro Events
  goal_weight: 250.0
  concede_weight: -100.0
  save_weight: 50.0
  goal_speed_multi: 1.5

  # Module 2: Ball Strike & xG Shot Engine
  touch_ball_weight: 12.0
  aligned_shot_weight: 40.0
  high_aerial_bounty: 25.0
  flick_bounty: 30.0
  directional_dodge_bounty: 15.0
  kickoff_first_touch_bonus: 35.0

  # Module 3: 3D Locomotion & Powerslide
  speed_toward_ball_weight: 0.06
  dodge_rush_multi: 1.6

  # Module 4: Context-Aware Tactical Aerials
  aerial_height_weight: 0.08
  air_dribble_carry_weight: 0.06

  # Module 5: Tactical Positioning & 50/50s
  behind_ball_weight: 0.04
  inactivity_penalty_weight: 0.05

  # Module 6: Boost Economy & Shields
  small_pad_weight: 6.0
  big_pad_weight: 18.0
  boost_steal_weight: 10.0
  save_boost_weight: 0.02
