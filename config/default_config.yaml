environment:
  game_mode: 1v1
  max_episode_steps: 3000
  num_envs: 64
  tick_skip: 8
hyperparameters:
  batch_size: 8192
  clip_range: 0.2
  ent_coef: 0.002
  gae_lambda: 0.95
  gamma: 0.995
  learning_rate: 0.0003
  mini_batch_size: 1024
  n_epochs: 2
logging:
  checkpoint_interval: 20
  log_dir: logs
  max_checkpoints_to_keep: 5
  save_dir: checkpoints
  tensorboard: true
model:
  activation: leaky_relu
  continuous_actions: true
  use_layer_norm: true
ppo:
  bc_decay_steps: 30000000
  bc_regularization_weight: 0.5
rewards:
  air_roll_recovery_weight: 0.35
  ball_to_goal_weight: 1.5
  boost_gain_weight: 0.6
  boost_lose_weight: 0.3
  concede_weight: -30.0
  goal_weight: 30.0
  jump_bridge_weight: 0.35
  player_to_ball_weight: 0.6
  powerslide_weight: 0.3
  save_weight: 8.0
  touch_weight: 1.2
scenarios:
  aerial_prob: 0.13
  kickoff_prob: 0.3
  replay_prob: 0.28
  save_prob: 0.12
  turnaround_prob: 0.05
  wall_prob: 0.12
